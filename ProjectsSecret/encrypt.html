<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Encrypt Story</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #121212;
            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            padding: 20px;
        }

        .container {

            width: 100%;
            max-width: 1000px;

            background: #1f1f1f;

            padding: 32px;

            border-radius: 12px;

            box-shadow: 0 0 20px rgba(0,0,0,.4);
        }

        .title {

            text-align: center;

            margin-bottom: 24px;
        }

        .title h1 {

            font-size: 28px;

            margin-bottom: 8px;
        }

        .title p {

            color: #999;
        }

        .form-group {

            margin-bottom: 16px;
        }

        label {

            display: block;

            margin-bottom: 8px;
        }

        input,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #444;

            background: #2a2a2a;

            color: white;

            border-radius: 6px;

            outline: none;
        }

        input:focus,
        textarea:focus {

            border-color: #4f8cff;
        }

        textarea {

            min-height: 350px;

            resize: vertical;

            font-family: Consolas,
                        monospace;
        }

        button {

            width: 100%;

            padding: 12px;

            background: #4f8cff;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {

            background: #3d73d6;
        }

        .status {

            margin-top: 16px;

            text-align: center;

            font-size: 15px;
        }

        .success {

            color: #4caf50;
        }

        .error {

            color: #ff6b6b;
        }

        .loading {

            color: #f7b731;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">
            <h1>Encrypt Story</h1>
            <p>Encrypt chapter và upload lên GitHub</p>
        </div>

        <div class="form-group">

            <label>Story Name</label>

            <input
                id="storyName"
                type="text"
                placeholder="USA">

        </div>

        <div class="form-group">

            <label>File Name</label>

            <input
                id="fileName"
                type="text"
                placeholder="Chap1">

        </div>

        <div class="form-group">

            <label>Secret Key</label>

            <input
                id="secretKey"
                type="password"
                placeholder="Enter password">

        </div>

        <div class="form-group">

            <label>Chapter Content</label>

            <textarea
                id="chapterContent"
                placeholder="Paste chapter HTML/content here..."></textarea>

        </div>

        <button onclick="encryptAndUpload()">
            Encrypt & Upload
        </button>

        <div
            id="status"
            class="status">
        </div>

    </div>

    <script>

        const GITHUB_OWNER =
            "TranNgocHoi729";

        const GITHUB_REPO =
            "Megiddos";

        const GITHUB_TOKEN =
            "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";

        async function encryptAndUpload() {

            const story =
                document
                .getElementById(
                    "storyName"
                )
                .value
                .trim();

            const fileName =
                document
                .getElementById(
                    "fileName"
                )
                .value
                .trim();

            const password =
                document
                .getElementById(
                    "secretKey"
                )
                .value;

            const content =
                document
                .getElementById(
                    "chapterContent"
                )
                .value;

            const status =
                document
                .getElementById(
                    "status"
                );

            status.innerHTML = "";

            if (
                !story ||
                !fileName ||
                !password ||
                !content
            ) {

                status.innerHTML =
                    `
                    <div class="error">
                        Vui lòng nhập đầy đủ thông tin.
                    </div>
                    `;

                return;
            }

            try {

                status.innerHTML =
                    `
                    <div class="loading">
                        Đang mã hóa và upload...
                    </div>
                    `;

                const encrypted =
                    await encryptText(
                        content,
                        password
                    );

                const path =
                    `ProjectsSecret/data/${story}/${fileName}.txt`;

                const response =
                    await fetch(
                        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`,
                        {
                            method: "PUT",

                            headers: {
                                Authorization:
                                    `Bearer ${GITHUB_TOKEN}`,

                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                message:
                                    `Add ${fileName}.txt`,
                                content:
                                    btoa(
                                        encrypted
                                    )
                            })
                        });

                if (!response.ok) {

                    const error =
                        await response.text();

                    throw new Error(
                        error
                    );
                }

                status.innerHTML =
                    `
                    <div class="success">
                        ✅ Upload Success
                        <br><br>
                        Story: ${story}
                        <br>
                        File: ${fileName}.txt
                    </div>
                    `;
            }
            catch (error) {

                console.error(error);

                status.innerHTML =
                    `
                    <div class="error">
                        ❌ Upload Failed
                        <br><br>
                        ${error.message}
                    </div>
                    `;
            }
        }

        async function createKey(
            password
        ) {

            const encoder =
                new TextEncoder();

            const passwordBuffer =
                encoder.encode(
                    password
                );

            const hash =
                await crypto.subtle.digest(
                    "SHA-256",
                    passwordBuffer
                );

            return crypto.subtle.importKey(
                "raw",
                hash,
                "AES-GCM",
                false,
                [
                    "encrypt",
                    "decrypt"
                ]
            );
        }
