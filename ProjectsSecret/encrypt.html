<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Encrypt Story</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #121212;
            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            padding: 20px;
        }

        .container {

            max-width: 1000px;

            margin: 0 auto;

            background: #1f1f1f;

            border-radius: 12px;

            padding: 32px;

            box-shadow: 0 0 20px rgba(0,0,0,.4);
        }

        .title {

            text-align: center;

            margin-bottom: 24px;
        }

        .title h1 {

            font-size: 28px;

            margin-bottom: 8px;
        }

        .title p {

            color: #999;
        }

        .form-group {

            margin-bottom: 16px;
        }

        label {

            display: block;

            margin-bottom: 8px;
        }

        input,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #444;

            background: #2a2a2a;

            color: white;

            border-radius: 6px;

            outline: none;
        }

        input:focus,
        textarea:focus {

            border-color: #4f8cff;
        }

        textarea {

            height: 400px;

            resize: vertical;

            font-family: Consolas,
                        monospace;
        }

        button {

            width: 100%;

            padding: 12px;

            background: #4f8cff;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #3d73d6;
        }

        .status {

            margin-top: 20px;

            text-align: center;
        }

        .success {

            color: #4caf50;
        }

        .error {

            color: #ff6b6b;
        }

        .loading {

            color: #f7b731;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="title">

        <h1>Encrypt Story</h1>

        <p>
            Encrypt chapter và upload lên GitHub
        </p>

    </div>

    <div class="form-group">

        <label>Story Name</label>

        <input
            id="storyName"
            type="text"
            placeholder="USA">

    </div>

    <div class="form-group">

        <label>File Name</label>

        <input
            id="fileName"
            type="text"
            placeholder="Chap1">

    </div>

    <div class="form-group">

        <label>Secret Key</label>

        <input
            id="secretKey"
            type="password">

    </div>

    <div class="form-group">

        <label>Chapter Content</label>

        <textarea
            id="chapterContent"></textarea>

    </div>

    <button onclick="encryptAndUpload()">

        Encrypt & Upload

    </button>

    <div
        id="status"
        class="status">
    </div>

</div>

<script>

    if (
        sessionStorage.getItem(
            "loggedIn"
        ) !== "true"
    ) {

        window.location.href =
            "index.html";
    }

    const GITHUB_OWNER =
        "TranNgocHoi729";

    const GITHUB_REPO =
        "Megiddos";

    const GITHUB_TOKEN = "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";

    async function encryptAndUpload() {

        const story =
            document
                .getElementById(
                    "storyName"
                )
                .value
                .trim();

        const fileName =
            document
                .getElementById(
                    "fileName"
                )
                .value
                .trim();

        const password =
            document
                .getElementById(
                    "secretKey"
                )
                .value;

        const content =
            document
                .getElementById(
                    "chapterContent"
                )
                .value;

        const status =
            document
                .getElementById(
                    "status"
                );

        if (
            !story ||
            !fileName ||
            !password ||
            !content
        ) {

            status.innerHTML =
                `
                <div class="error">
                    Vui lòng nhập đầy đủ thông tin.
                </div>
                `;

            return;
        }

        try {

            status.innerHTML =
                `
                <div class="loading">
                    Đang encrypt và upload...
                </div>
                `;

            const encrypted =
                await encryptText(
                    content,
                    password
                );

            const githubPath =
                `ProjectsSecret/data/${story}/${fileName}.txt`;

            const apiUrl =
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${githubPath}`;

            const response =
                await fetch(
                    apiUrl,
                    {
                        method: "PUT",

                        headers: {
                            "Authorization":
                                `Bearer ${GITHUB_TOKEN}`,

                            "Content-Type":
                                "application/json"
                        },

                        body:
                        JSON.stringify(
                        {
                            message:
                                `Add ${fileName}.txt`,

                            content:
                                btoa(
                                    encrypted
                                )
                        })
                    }
                );

            if (!response.ok) {

                const errorText =
                    await response.text();

                throw new Error(
                    errorText
                );
            }

            status.innerHTML =
                `
                <div class="success">
                    ✅ Upload Success
                    <br><br>
                    Story:
                    ${story}
                    <br>
                    File:
                    ${fileName}.txt
                </div>
                `;
        }
        catch (error) {

            console.error(error);

            status.innerHTML =
                `
                <div class="error">
                    ❌ Upload Failed
                    <br><br>
                    ${error.message}
                </div>
                `;
        }
    }

    async function createKey(
        password
    ) {

        const encoder =
            new TextEncoder();

        const passwordBuffer =
            encoder.encode(
                password
            );

        const hash =
            await crypto.subtle.digest(
                "SHA-256",
                passwordBuffer
            );

        return crypto.subtle.importKey(
            "raw",
            hash,
            "AES-GCM",
            false,
            [
                "encrypt",
                "decrypt"
            ]
        );
    }

    function arrayBufferToBase64(
        buffer
    ) {

        let binary = '';

        const bytes =
            new Uint8Array(
                buffer
            );

        for (
            let i = 0;
            i < bytes.length;
            i++
        ) {

            binary +=
                String.fromCharCode(
                    bytes[i]
                );
        }

        return btoa(binary);
    }

    function base64ToArrayBuffer(
        base64
    ) {

        const binary =
            atob(base64);

        const bytes =
            new Uint8Array(
                binary.length
            );

        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);
        }

        return bytes;
    }

    async function encryptText(
        text,
        password
    ) {

        const key =
            await createKey(
                password
            );

        const iv =
            crypto.getRandomValues(
                new Uint8Array(12)
            );

        const encodedText =
            new TextEncoder()
                .encode(text);

        const encrypted =
            await crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                key,
                encodedText
            );

        const combined =
            new Uint8Array(
                iv.length +
                encrypted.byteLength
            );

        combined.set(
            iv,
            0
        );

        combined.set(
            new Uint8Array(
                encrypted
            ),
            iv.length
        );

        return arrayBufferToBase64(
            combined
        );
    }

</script>

</body>

</html>
