<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novel Reader</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #121212;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            background: #1f1f1f;
            border-bottom: 1px solid #333;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .menu-item {
            cursor: pointer;
            color: #bdbdbd;
            font-weight: 600;
            transition: .2s;
        }

        .menu-item:hover {
            color: white;
        }

        .menu-item.active {
            color: #4f8cff;
        }

        .logout-btn {
            background: #dc3545;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 10px 16px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        .container {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 20px;
        }

        .search-box {
            width: 100%;

            padding: 12px 14px;

            border-radius: 8px;
            border: 1px solid #333;

            background: #1f1f1f;
            color: white;

            outline: none;

            margin-bottom: 24px;
        }

        .search-box:focus {
            border-color: #4f8cff;
        }

        .story-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));

            gap: 16px;
        }

        .story-card {

            background: #1f1f1f;

            border: 1px solid #333;
            border-radius: 10px;

            padding: 20px;

            cursor: pointer;

            transition: .2s;
        }

        .story-card:hover {

            border-color: #4f8cff;

            transform: translateY(-2px);
        }

        .story-title {

            font-size: 18px;
            font-weight: bold;
        }

        .loading {

            text-align: center;

            color: #999;

            padding: 50px 20px;
        }

        .empty-state {

            text-align: center;

            padding: 60px 20px;

            background: #1f1f1f;

            border: 1px dashed #444;
            border-radius: 10px;

            color: #999;
        }

        .error-state {

            text-align: center;

            padding: 60px 20px;

            background: #2b1f1f;

            border: 1px solid #6b2f2f;
            border-radius: 10px;

            color: #ff8a8a;
        }

        .error-detail {

            margin-top: 10px;

            color: #bbb;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="header">

        <div class="menu">

            <div
                class="menu-item active"
                onclick="goStory()">
                STORY
            </div>

            <div
                class="menu-item"
                onclick="goUploadStory()">
                UPLOAD STORY
            </div>

            <div
                class="menu-item"
                onclick="goUploadStory()">
                ENCRYPT STORY
            </div>
        </div>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

    <div class="container">

        <input
            id="searchInput"
            class="search-box"
            type="text"
            placeholder="Tìm kiếm truyện..."
            oninput="filterStories()">

        <div
            id="loading"
            class="loading">

            Đang tải danh sách truyện...

        </div>

        <div
            id="storyContainer"
            class="story-grid">
        </div>

    </div>

    <script>

        // =========================
        // CONFIG
        // =========================

        const GITHUB_OWNER = "TranNgocHoi729";
        const GITHUB_REPO  = "Megiddos";

        // =========================
        // STATE
        // =========================

        let stories = [];

        // =========================
        // INIT
        // =========================

        checkLogin();
        loadStories();

        // =========================
        // AUTH
        // =========================

        function checkLogin() {

            if (
                sessionStorage.getItem("loggedIn")
                !== "true"
            ) {

                window.location.href =
                    "index.html";
            }
        }

        function logout() {

            sessionStorage.removeItem(
                "loggedIn"
            );

            window.location.href =
                "index.html";
        }

        // =========================
        // MENU
        // =========================

        function goStory() {

            window.location.href =
                "home.html";
        }

       function goUploadStory() {

            window.location.href =
                "encrypt.html";
        }

        // =========================
        // LOAD STORY
        // =========================

        async function loadStories() {

            const loading =
                document.getElementById("loading");

            const container =
                document.getElementById("storyContainer");

            try {

               const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/ProjectsSecret/data`;

                const response =
                    await fetch(url);

                if (!response.ok) {

                    throw new Error(
                        `GitHub API Error (${response.status})`
                    );
                }

                const data =
                    await response.json();

                stories = data
                    .filter(x => x.type === "dir")
                    .map(x => ({
                        name: x.name
                    }));

                renderStories(stories);

                loading.style.display =
                    "none";
            }
            catch (error) {

                console.error(error);

                loading.style.display =
                    "none";

                container.innerHTML = `
                    <div class="error-state">
                        Không thể tải dữ liệu truyện.
                        <div class="error-detail">
                            ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // =========================
        // RENDER
        // =========================

        function renderStories(items) {

            const container =
                document.getElementById(
                    "storyContainer"
                );

            container.innerHTML = "";

            if (!items || items.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">
                        Chưa có truyện nào.
                    </div>
                `;

                return;
            }

            items.forEach(story => {

                const card =
                    document.createElement("div");

                card.className =
                    "story-card";

                card.innerHTML = `
                    <div class="story-title">
                        ${story.name}
                    </div>
                `;

                card.onclick = () => {

                    window.location.href =
                        `story.html?story=${encodeURIComponent(story.name)}`;
                };

                container.appendChild(card);
            });
        }

        // =========================
        // SEARCH
        // =========================

        function filterStories() {

            const keyword =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase()
                    .trim();

            if (!keyword) {

                renderStories(stories);
                return;
            }

            const filtered =
                stories.filter(
                    x =>
                        x.name
                         .toLowerCase()
                         .includes(keyword)
                );

            renderStories(filtered);
        }

    </script>

</body>

</html>
