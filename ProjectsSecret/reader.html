
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Novel Reader</title>

    <style>

        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .header {

            height: 60px;

            display: flex;
            align-items: center;

            padding: 0 20px;

            background: #1f1f1f;

            border-bottom: 1px solid #333;
        }

        .btn {

            background: #4f8cff;
            color: white;

            border: none;

            padding: 10px 16px;

            border-radius: 6px;

            cursor: pointer;
        }

        .reader-container {

            max-width: 1000px;

            margin: 20px auto;

            padding: 20px;
        }

        .chapter-title {

            text-align: center;

            margin-bottom: 20px;
        }

        .content {

            background: #1f1f1f;

            border-radius: 10px;

            padding: 24px;

            min-height: 400px;
        }

        .navigation {

            margin-top: 20px;

            display: flex;

            justify-content: space-between;
        }

        img {

            max-width: 100%;
        }

    </style>

</head>

<body>

    <div class="header">

        <button
            class="btn"
            onclick="goBack()">

            ← Chapters

        </button>

    </div>

    <div class="reader-container">

        <h2
            id="chapterTitle"
            class="chapter-title">

            Loading...

        </h2>

        <div
            id="content"
            class="content">

            Đang tải nội dung...

        </div>

        <div class="navigation">

            <button
                class="btn"
                onclick="goPrevious()">

                ← Previous

            </button>

            <button
                class="btn"
                onclick="goNext()">

                Next →

            </button>

        </div>

    </div>

    <script>

    const params = new URLSearchParams(
        window.location.search
    );

    const story =
        params.get("story");

    const chapter =
        params.get("chapter");

    checkLogin();
    loadChapter();

    function checkLogin() {

        if (
            sessionStorage.getItem("loggedIn")
            !== "true"
        ) {

            window.location.href =
                "index.html";
        }
    }

    function goBack() {

        window.location.href =
            `story.html?story=${encodeURIComponent(story)}`;
    }

    async function loadChapter() {
    console.log("story:", story);
    console.log("chapter:", chapter);
    
    console.log(
        "title:",
        document.getElementById("chapterTitle")
    );
    
    console.log(
        "content:",
        document.getElementById("content")
    );
        try {

            const content =
                document.getElementById(
                    "content"
                );

            const title =
                document.getElementById(
                    "chapterTitle"
                );

            title.innerText =
                chapter
                    ?.replace(".enc", "")
                    || "Chapter";

            const response =
                await fetch(
                    `data/${story}/${chapter}`
                );

            if (!response.ok) {

                showFallback();
                return;
            }

            const encrypted =
                await response.text();

            const html =
                await decrypt(encrypted);

            if (
                !html ||
                html.trim().length === 0
            ) {

                showFallback();
                return;
            }

            content.innerHTML =
                html;
        }
        catch (error) {

            console.error(error);

            showFallback();
        }
    }

    function showFallback() {

        document.getElementById(
            "content"
        ).innerHTML =
        `
        <div
            style="
                text-align:center;
                color:#aaa;
                padding:60px;
            ">
            Truyện đang cập nhật
        </div>
        `;
    }

    async function decrypt(cipherText) {

        try {

            const password =
                sessionStorage.getItem(
                    "password"
                );

            if (!password) {

                throw new Error(
                    "Password not found"
                );
            }

            const key =
                await createKey(
                    password
                );

            const combined =
                base64ToArrayBuffer(
                    cipherText.trim()
                );

            const iv =
                combined.slice(0, 12);

            const encrypted =
                combined.slice(12);

            const decrypted =
                await crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv
                    },
                    key,
                    encrypted
                );

            return new TextDecoder()
                .decode(decrypted);
        }
        catch (error) {

            console.error(
                "Decrypt error:",
                error
            );

            return "";
        }
    }

    async function createKey(
        password
    ) {

        const encoder =
            new TextEncoder();

        const passwordBuffer =
            encoder.encode(
                password
            );

        const hash =
            await crypto.subtle.digest(
                "SHA-256",
                passwordBuffer
            );

        return crypto.subtle.importKey(
            "raw",
            hash,
            "AES-GCM",
            false,
            [
                "encrypt",
                "decrypt"
            ]
        );
    }

    function base64ToArrayBuffer(
        base64
    ) {

        const binary =
            atob(base64);

        const bytes =
            new Uint8Array(
                binary.length
            );

        for (
            let i = 0;
            i < binary.length;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);
        }

        return bytes;
    }

    function goPrevious() {

        alert(
            "Coming Soon"
        );
    }

    function goNext() {

        alert(
            "Coming Soon"
        );
    }

</script>

</body>

</html>
